[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventoy-depot"
version = "0.2.0"
description = "Safely discover, verify, download, and manage ISOs on Ventoy drives."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ventoy Depot contributors" }]
dependencies = ["platformdirs>=4.0", "textual>=8.2.8,<9"]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
ventoy-depot = "ventoy_depot.cli:main"
ventoy-iso-updater = "ventoy_depot.compat:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ventoy_depot", "src/ventoy_iso_updater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["ventoy_depot"]
strict = true
warn_unused_ignores = true
